name: Verify staging catalog and settings parity
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-staging-catalog-settings
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify catalog parser, settings, aisles and household boundaries
        run: node scripts/verify-staging-catalog-settings.mjs
