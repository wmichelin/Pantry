name: Verify staging running queue parity
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-staging-queue
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify queue parity, retry and household boundaries
        run: node scripts/verify-staging-queue.mjs
