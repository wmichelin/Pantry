name: Verify staging recipe import parity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-staging-recipe-import
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compare legacy and Go imports with isolated staging identities
        run: node scripts/verify-staging-recipe-import.mjs
