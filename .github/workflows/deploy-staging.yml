name: Deploy staging

# Staging is deliberately manual and uses its own Supabase URL/key. It shares
# the production droplet only as a host; the container, port, nginx vhost, and
# GitHub Actions concurrency group are all distinct from production.
on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/wmichelin/pantry:staging-${{ github.sha }}
      DOMAIN: ${{ vars.STAGING_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            EXPO_PUBLIC_SUPABASE_URL=${{ secrets.STAGING_SUPABASE_URL }}
            EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }}

      - name: Deploy staging on the shared droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ env.IMAGE }}
          DOMAIN: ${{ env.DOMAIN }}
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: IMAGE,DOMAIN,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            : "${DOMAIN:?STAGING_DOMAIN must be configured}"
            command -v docker >/dev/null 2>&1 || {
              apt-get update -y
              apt-get install -y docker.io
              systemctl enable --now docker
            }
            command -v nginx >/dev/null 2>&1 || {
              echo "nginx must already be installed for the shared-droplet staging deployment" >&2
              exit 1
            }

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE"
            docker rm -f pantry-staging >/dev/null 2>&1 || true
            docker run -d --name pantry-staging --restart always \
              -p 127.0.0.1:18081:80 "$IMAGE"

            install -d -m 0755 /etc/nginx/sites-available /etc/nginx/sites-enabled
            cat > /etc/nginx/sites-available/pantry-staging <<EOF
            server {
              listen 80;
              server_name ${DOMAIN};

              location / {
                proxy_pass http://127.0.0.1:18081;
                proxy_http_version 1.1;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
              }
            }
            EOF
            ln -sfn /etc/nginx/sites-available/pantry-staging /etc/nginx/sites-enabled/pantry-staging
            nginx -t
            systemctl reload nginx
            curl --fail --silent --show-error -H "Host: $DOMAIN" http://127.0.0.1/ >/dev/null

            # Production already uses certbot on this host. Obtain a separate
            # certificate for staging; a failure stops the deployment instead of
            # silently leaving an authentication-capable app on HTTP.
            command -v certbot >/dev/null 2>&1 || {
              echo "certbot must already be installed for HTTPS staging" >&2
              exit 1
            }
            certbot --nginx --non-interactive --agree-tos --redirect -d "$DOMAIN"
            nginx -t
            systemctl reload nginx
