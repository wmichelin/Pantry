name: Verify staging board import recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-staging-board-import
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify recoverable board imports against isolated staging data
        run: bun scripts/verify-staging-board-import.ts
