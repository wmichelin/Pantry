name: Teardown unapproved staging endpoint

on:
  workflow_dispatch:

jobs:
  teardown:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Remove only the staging container and vhost
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            docker rm -f pantry-staging >/dev/null 2>&1 || true
            rm -f /etc/nginx/sites-enabled/pantry-staging
            rm -f /etc/nginx/sites-available/pantry-staging
            nginx -t
            systemctl reload nginx
