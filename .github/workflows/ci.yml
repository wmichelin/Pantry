name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Protobuf contracts
        run: |
          npm run proto:format:check
          npm run proto:lint
          npm run proto:build
          ./scripts/check-proto-breaking.sh

      - name: Verify committed generated code
        run: |
          npm run proto:generate
          git diff --exit-code -- internal/gen lib/gen
          test -z "$(git status --porcelain --untracked-files=all -- internal/gen lib/gen)"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: bun test

      - name: Build static web export
        run: npx expo export --platform web

  go-api:
    name: Go API foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.11
          check-latest: true

      - name: Verify module integrity
        run: go mod verify

      - name: Vet Go API
        run: go vet ./...

      - name: Test Go API with race detection
        run: go test -race ./...

      - name: Build production-shaped API image
        run: docker build --file Dockerfile.api --tag pantry-api:ci .
