name: Publish staging on approved domain

on:
  workflow_dispatch:

concurrency:
  group: publish-staging-domain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish the approved staging hostname
    runs-on: ubuntu-latest
    steps:
      - name: Configure HTTPS for pantry-staging.waltermichelin.com only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            readonly domain='pantry-staging.waltermichelin.com'
            readonly site_available='/etc/nginx/sites-available/pantry-staging'
            readonly site_enabled='/etc/nginx/sites-enabled/pantry-staging'
            readonly production_domain='pantry.waltermichelin.com'
            readonly production_container='pantry'
            readonly rollback_dir="$(mktemp -d)"
            published=false
            saved_site_available=false
            saved_site_enabled=false

            verify_production() {
              docker inspect --format '{{.State.Running}}' "$production_container" | grep -Fx true >/dev/null
              curl --fail --silent --show-error \
                --resolve "$production_domain:443:127.0.0.1" "https://$production_domain/" >/dev/null
            }

            cleanup_unpublished_site() {
              status="$?"
              if [ "$published" = false ]; then
                # Restore only the prior staging vhost after a failed attempt;
                # production paths remain read-only throughout this workflow.
                if ! (
                  rm -f "$site_enabled" "$site_available"
                  if [ "$saved_site_available" = true ]; then
                    cp -a "$rollback_dir/site_available" "$site_available"
                  fi
                  if [ "$saved_site_enabled" = true ]; then
                    cp -a "$rollback_dir/site_enabled" "$site_enabled"
                  fi
                  if nginx -t; then
                    verify_production
                    systemctl reload nginx
                    verify_production
                  fi
                ); then
                  echo 'Could not fully restore the previous staging Nginx configuration.' >&2
                fi
              fi
              rm -rf "$rollback_dir"
              trap - EXIT
              exit "$status"
            }
            trap cleanup_unpublished_site EXIT

            command -v nginx >/dev/null 2>&1
            command -v certbot >/dev/null 2>&1
            curl --fail --silent --show-error http://127.0.0.1:18081/ >/dev/null
            verify_production

            install -d -m 0755 /etc/nginx/sites-available /etc/nginx/sites-enabled
            if [ -e "$site_available" ]; then
              cp -a "$site_available" "$rollback_dir/site_available"
              saved_site_available=true
            fi
            if [ -e "$site_enabled" ] || [ -L "$site_enabled" ]; then
              cp -a "$site_enabled" "$rollback_dir/site_enabled"
              saved_site_enabled=true
            fi
            printf '%s' '' | base64 --decode > "$site_available"
            ln -sfn "$site_available" "$site_enabled"
            nginx -t
            verify_production
            systemctl reload nginx
            verify_production

            certbot --nginx --non-interactive --agree-tos --redirect -d "$domain"
            nginx -t
            verify_production
            systemctl reload nginx
            verify_production
            curl --fail --silent --show-error \
              --resolve "$domain:443:127.0.0.1" "https://$domain/" >/dev/null
            ss -ltn '( sport = :18081 )' | grep -F '127.0.0.1:18081'

            published=true
            trap - EXIT
            rm -rf "$rollback_dir"
