name: Converge staging on approved domain

on:
  workflow_dispatch:

concurrency:
  group: publish-staging-domain
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Converge the approved staging proxy
    runs-on: ubuntu-latest
    steps:
      - name: Configure board streaming for pantry-staging.waltermichelin.com only
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            readonly domain='pantry-staging.waltermichelin.com'
            readonly site_available='/etc/nginx/sites-available/pantry-staging'
            readonly site_enabled='/etc/nginx/sites-enabled/pantry-staging'
            readonly production_domain='pantry.waltermichelin.com'
            readonly production_container='pantry'
            readonly marker='location = /api/rpc/pantry.v1.BoardImportService/ImportBoard {'
            readonly rollback_dir="$(mktemp -d)"
            readonly candidate="$rollback_dir/pantry-staging.candidate"
            changed=false
            restored=false

            verify_production() {
              docker inspect --format '{{.State.Running}}' "$production_container" | grep -Fx true >/dev/null || return 1
              curl --fail --silent --show-error \
                --resolve "$production_domain:443:127.0.0.1" "https://$production_domain/" >/dev/null || return 1
            }

            verify_staging() {
              curl --fail --silent --show-error \
                --resolve "$domain:443:127.0.0.1" "https://$domain/" >/dev/null || return 1
              api_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
                --resolve "$domain:443:127.0.0.1" "https://$domain/api/v1/membership")" || return 1
              test "$api_status" = 401 || return 1
              ss -ltn '( sport = :18081 )' | grep -F '127.0.0.1:18081' || return 1
              ss -ltn '( sport = :18083 )' | grep -F '127.0.0.1:18083' || return 1
            }

            restore_staging_proxy() {
              status="$?"
              trap - EXIT
              if [ "$status" -ne 0 ] && [ "$changed" = true ]; then
                echo 'Staging proxy validation failed; restoring its exact prior vhost.' >&2
                if install -o root -g root -m 0644 "$rollback_dir/pantry-staging.before" "$site_available" \
                  && nginx -t \
                  && systemctl reload nginx \
                  && verify_production \
                  && verify_staging; then
                  restored=true
                else
                  echo "Automatic restore could not be verified; retained recovery copy at $rollback_dir/pantry-staging.before" >&2
                fi
              fi
              if [ "$status" -eq 0 ] || [ "$changed" = false ] || [ "$restored" = true ]; then
                rm -rf "$rollback_dir"
              fi
              exit "$status"
            }

            # The trap is harmless until changed=true. A failed precheck only
            # cleans the temporary directory and cannot touch the live vhost.
            trap restore_staging_proxy EXIT
            command -v nginx >/dev/null 2>&1
            test -f "$site_available"
            test -e "$site_enabled" || test -L "$site_enabled"
            test "$(readlink -f "$site_enabled")" = "$site_available"
            test "$(grep -Fc 'server_name pantry-staging.waltermichelin.com;' "$site_available")" -ge 1
            test "$(grep -Ec '^[[:space:]]*location /api/ \{$' "$site_available")" -eq 1
            nginx -t
            verify_production
            verify_staging

            if grep -Fq "$marker" "$site_available"; then
              test "$(grep -Fc "$marker" "$site_available")" -eq 1
              test "$(grep -Fc 'client_max_body_size 4m;' "$site_available")" -eq 1
              test "$(grep -Fc 'proxy_buffering off;' "$site_available")" -eq 1
              test "$(grep -Fc 'proxy_read_timeout 310s;' "$site_available")" -eq 1
              test "$(grep -Fc 'proxy_send_timeout 310s;' "$site_available")" -eq 1
              echo 'Staging board-stream proxy configuration is already converged.'
              rm -rf "$rollback_dir"
              exit 0
            fi
            if grep -Fq 'BoardImportService/ImportBoard' "$site_available"; then
              echo 'An unrecognized board-import proxy rule already exists; refusing to overwrite it.' >&2
              exit 1
            fi

            cp -a "$site_available" "$rollback_dir/pantry-staging.before"
            awk '!inserted && /^[[:space:]]*location \/api\/ \{$/ { print "  location = /api/rpc/pantry.v1.BoardImportService/ImportBoard {\n    client_max_body_size 4m;\n    proxy_pass http://127.0.0.1:18083;\n    proxy_http_version 1.1;\n    proxy_buffering off;\n    proxy_read_timeout 310s;\n    proxy_send_timeout 310s;\n    proxy_set_header Host $host;\n    proxy_set_header Authorization $http_authorization;\n    proxy_set_header X-Real-IP $remote_addr;\n    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n    proxy_set_header X-Forwarded-Proto $scheme;\n  }\n"; inserted=1 } { print } END { if (!inserted) exit 42 }' "$site_available" > "$candidate"

            test "$(grep -Fc "$marker" "$candidate")" -eq 1
            test "$(grep -Fc 'client_max_body_size 4m;' "$candidate")" -eq 1
            test "$(grep -Fc 'proxy_buffering off;' "$candidate")" -eq 1
            test "$(grep -Fc 'proxy_read_timeout 310s;' "$candidate")" -eq 1
            test "$(grep -Fc 'proxy_send_timeout 310s;' "$candidate")" -eq 1
            changed=true
            install -o root -g root -m 0644 "$candidate" "$site_available"
            nginx -t
            verify_production
            systemctl reload nginx
            verify_production
            verify_staging

            trap - EXIT
            rm -rf "$rollback_dir"
