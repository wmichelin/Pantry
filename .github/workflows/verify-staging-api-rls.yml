name: Verify staging household membership parity

# This staging-only acceptance test creates per-run identities, then proves that
# the Go API and RPCs create and join households atomically. It never targets
# production and leaves only isolated staging fixtures behind.
on:
  workflow_dispatch:
    inputs:
      verify_recipe:
        description: "Also require the staged atomic recipe database RPC"
        required: true
        default: false
        type: boolean

concurrency:
  group: verify-staging-household-membership
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Prove create/join parity and RLS boundaries
    runs-on: ubuntu-latest
    env:
      STAGING_SUPABASE_URL: https://fncsyvsgolbpviidmpuc.supabase.co
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      GO_RLS_RUN_ID: ${{ github.run_id }}
      VERIFY_RECIPE: ${{ inputs.verify_recipe }}
    steps:
      - name: Create isolated staging identities
        shell: bash
        run: |
          set -euo pipefail

          create_identity() {
            local suffix="$1"
            local token_variable="$2"
            local id_variable="$3"
            local email="go-port-household-${GITHUB_RUN_ID}-${suffix}@example.invalid"
            local password
            local response
            local status
            local body
            local token
            local user_id

            password="$(openssl rand -hex 24)"
            response="$(curl --silent --show-error --write-out '\n%{http_code}' \
              --request POST "${STAGING_SUPABASE_URL}/auth/v1/signup" \
              --header "apikey: ${STAGING_SUPABASE_ANON_KEY}" \
              --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg email "$email" --arg password "$password" '{email: $email, password: $password}')")"
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [ "$status" != 200 ]; then
              error_code="$(printf '%s' "$body" | jq -r '.code // .error // "unknown"')"
              echo "Staging Auth rejected an isolated test signup: status=${status} code=${error_code}" >&2
              exit 1
            fi
            token="$(printf '%s' "$body" | jq -er '.access_token')"
            user_id="$(printf '%s' "$body" | jq -er '.user.id')"
            echo "::add-mask::$token"
            printf '%s=%s\n' "$token_variable" "$token" >> "$GITHUB_ENV"
            printf '%s=%s\n' "$id_variable" "$user_id" >> "$GITHUB_ENV"
          }

          create_identity owner GO_RLS_OWNER_TOKEN GO_RLS_OWNER_ID
          create_identity outsider GO_RLS_OUTSIDER_TOKEN GO_RLS_OUTSIDER_ID

      - name: Prove the Go API owns staging create and join behavior
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          envs: GO_RLS_OWNER_TOKEN,GO_RLS_OUTSIDER_TOKEN,GO_RLS_OUTSIDER_ID,GO_RLS_RUN_ID,STAGING_SUPABASE_ANON_KEY,VERIFY_RECIPE
          script: |
            set -euo pipefail

            household_name="Go Household ${GO_RLS_RUN_ID}"
            create_result="$(curl --fail --silent --show-error \
              --request POST http://127.0.0.1:18083/api/v1/households \
              --header "Authorization: Bearer ${GO_RLS_OWNER_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg name "$household_name" --arg display "Go owner" '{name: $name, display_name: $display}')")"
            household_id="$(printf '%s' "$create_result" | jq -er '.household.id')"
            invite_code="$(printf '%s' "$create_result" | jq -er '.household.invite_code')"
            echo 'gate: legacy household creation passed'

            owner_membership="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GO_RLS_OWNER_TOKEN}" \
              http://127.0.0.1:18083/api/v1/membership)"
            printf '%s' "$owner_membership" | jq -e \
              --arg household_id "$household_id" \
              --arg household_name "$household_name" \
              '.membership.household_id == $household_id and .membership.role == "owner" and .membership.households.name == $household_name' \
              >/dev/null
            echo 'gate: legacy membership projection passed'

            # Connect JSON exercises the same generated handlers as binary
            # Protobuf while keeping this remote shell probe dependency-free.
            connect_membership="$(curl --fail --silent --show-error \
              --request POST http://127.0.0.1:18083/api/rpc/pantry.v1.HouseholdService/GetMembership \
              --header "Authorization: Bearer ${GO_RLS_OWNER_TOKEN}" \
              --header 'Content-Type: application/json' \
              --header 'Connect-Protocol-Version: 1' \
              --data '{}')"
            printf '%s' "$connect_membership" | jq -e \
              --arg household_id "$household_id" \
              --arg household_name "$household_name" \
              '.membership.householdId == $household_id and .membership.role == "owner" and .membership.household.name == $household_name' \
              >/dev/null
            echo 'gate: Connect membership projection passed'

            direct_join_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request POST https://fncsyvsgolbpviidmpuc.supabase.co/rest/v1/household_members \
              --header "apikey: ${STAGING_SUPABASE_ANON_KEY}" \
              --header "Authorization: Bearer ${GO_RLS_OUTSIDER_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg household "$household_id" --arg user "$GO_RLS_OUTSIDER_ID" '{household_id: $household, user_id: $user, display_name: "forged", role: "owner"}')")"
            if [ "$direct_join_status" -ge 200 ] && [ "$direct_join_status" -lt 300 ]; then
              echo 'Direct membership creation unexpectedly succeeded.' >&2
              exit 1
            fi
            echo 'gate: direct RLS forgery rejected'

            invalid_status="$(curl --silent --show-error --output /tmp/invalid-invite.json --write-out '%{http_code}' \
              --request POST http://127.0.0.1:18083/api/rpc/pantry.v1.HouseholdService/JoinHousehold \
              --header "Authorization: Bearer ${GO_RLS_OUTSIDER_TOKEN}" \
              --header 'Content-Type: application/json' \
              --header 'Connect-Protocol-Version: 1' \
              --data '{"inviteCode":"NOT-A-REAL-INVITE"}')"
            test "$invalid_status" = 404
            jq -e '.code == "not_found" and (.details | length) == 1' /tmp/invalid-invite.json >/dev/null
            echo 'gate: typed Connect not-found response passed'

            join_result="$(curl --fail --silent --show-error \
              --request POST http://127.0.0.1:18083/api/rpc/pantry.v1.HouseholdService/JoinHousehold \
              --header "Authorization: Bearer ${GO_RLS_OUTSIDER_TOKEN}" \
              --header 'Content-Type: application/json' \
              --header 'Connect-Protocol-Version: 1' \
              --data "$(jq -nc --arg invite "$invite_code" --arg display "Go member" '{inviteCode: $invite, displayName: $display}')")"
            printf '%s' "$join_result" | jq -e --arg household_id "$household_id" \
              '.household.id == $household_id and ((.household.alreadyMember // false) == false)' >/dev/null
            echo 'gate: Connect household join passed'

            duplicate_join="$(curl --fail --silent --show-error \
              --request POST http://127.0.0.1:18083/api/v1/household-joins \
              --header "Authorization: Bearer ${GO_RLS_OUTSIDER_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "$(jq -nc --arg invite "$invite_code" --arg display "Go member" '{invite_code: $invite, display_name: $display}')")"
            printf '%s' "$duplicate_join" | jq -e '.household.already_member == true' >/dev/null
            echo 'gate: cross-transport idempotent join passed'

            if [ "$VERIFY_RECIPE" = true ]; then
              saved_recipe="$(curl --fail --silent --show-error \
                --request POST http://127.0.0.1:18083/api/rpc/pantry.v1.RecipeService/SaveRecipe \
                --header "Authorization: Bearer ${GO_RLS_OWNER_TOKEN}" \
                --header 'Content-Type: application/json' \
                --header 'Connect-Protocol-Version: 1' \
                --data "$(jq -nc --arg household "$household_id" --arg title "Connect Soup ${GO_RLS_RUN_ID}" \
                  '{householdId: $household, title: $title, ingredients: [{name: "salt", unit: "", rawString: "salt"}, {name: "water", quantity: 0, unit: "cups", rawString: "0 cups water"}]}')")"
              printf '%s' "$saved_recipe" | jq -e \
                --arg title "Connect Soup ${GO_RLS_RUN_ID}" \
                '.recipe.title == $title and .recipe.ingredientCount == 2' >/dev/null
              echo 'gate: Connect atomic recipe save passed'
            else
              echo 'gate: recipe save intentionally skipped pending its staging database RPC'
            fi

            outsider_membership="$(curl --fail --silent --show-error \
              --header "Authorization: Bearer ${GO_RLS_OUTSIDER_TOKEN}" \
              http://127.0.0.1:18083/api/v1/membership)"
            printf '%s' "$outsider_membership" | jq -e --arg household_id "$household_id" \
              '.membership.household_id == $household_id and .membership.role == "member"' >/dev/null
            echo 'gate: joined membership projection passed'

            anonymous_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              http://127.0.0.1:18083/api/v1/membership)"
            test "$anonymous_status" = 401

            anonymous_connect_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --request POST http://127.0.0.1:18083/api/rpc/pantry.v1.HouseholdService/GetMembership \
              --header 'Content-Type: application/proto' \
              --header 'Connect-Protocol-Version: 1' \
              --data-binary '')"
            test "$anonymous_connect_status" = 401
            echo 'gate: anonymous REST and Connect requests rejected'
