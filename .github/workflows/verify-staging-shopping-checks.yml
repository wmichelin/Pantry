name: Verify staging shopping checks parity
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-staging-shopping-checks
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify checks and shopping clear household boundaries
        run: node scripts/verify-staging-shopping-checks.mjs
