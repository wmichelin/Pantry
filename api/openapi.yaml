openapi: 3.1.0
info:
  title: Pantry API
  version: 0.1.0
  description: |
    Foundation contract for the staged Go port. Only health, readiness,
    verified-identity, and read-only household-membership endpoints are
    implemented in this revision. Household,
    recipe, shopping, and scrape capabilities remain on their existing client
    paths until each has passed the compatibility gates in contracts/compatibility.md.
paths:
  /healthz:
    get:
      responses:
        '200':
          description: Process is live.
  /readyz:
    get:
      responses:
        '200':
          description: Foundation process is configured and accepting traffic.
  /api/v1/whoami:
    get:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verified caller identity.
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/households:
    get:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Caller-visible households, authorized by existing Supabase RLS policies.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '502':
          description: Supabase REST was unavailable or rejected the request.
  /api/v1/membership:
    get:
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The caller's first visible household membership, authorized by existing Supabase RLS policies.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '502':
          description: Supabase REST was unavailable or rejected the request.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthenticated:
      description: Missing, invalid, expired, or wrong-role access token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
