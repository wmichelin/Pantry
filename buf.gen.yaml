version: v2
clean: true
inputs:
  - directory: proto
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: internal/gen
    opt:
      - paths=source_relative
  - remote: buf.build/connectrpc/go:v1.19.2
    out: internal/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-es
    out: lib/gen
    opt:
      - target=ts
