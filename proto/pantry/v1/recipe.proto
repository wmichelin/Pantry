syntax = "proto3";

package pantry.v1;

option go_package = "github.com/wmichelin/Pantry/internal/gen/pantry/v1;pantryv1";

service RecipeService {
  rpc SaveRecipe(SaveRecipeRequest) returns (SaveRecipeResponse);
  rpc ImportRecipe(ImportRecipeRequest) returns (ImportRecipeResponse);
  rpc ListRecipes(ListRecipesRequest) returns (ListRecipesResponse);
  rpc GetRecipe(GetRecipeRequest) returns (GetRecipeResponse);
  rpc SearchRecipeIngredients(SearchRecipeIngredientsRequest) returns (SearchRecipeIngredientsResponse);
  rpc UpdateRecipeTags(UpdateRecipeTagsRequest) returns (UpdateRecipeTagsResponse);
  rpc DeleteRecipe(DeleteRecipeRequest) returns (DeleteRecipeResponse);
}

message RecipeIngredient {
  string name = 1;
  optional double quantity = 2;
  string unit = 3;
  string raw_string = 4;
}

message SaveRecipeRequest {
  string household_id = 1;
  string title = 2;
  repeated RecipeIngredient ingredients = 3;
}

message SavedRecipe {
  string id = 1;
  string title = 2;
  int32 ingredient_count = 3;
}

message SaveRecipeResponse {
  SavedRecipe recipe = 1;
}

// Imports retain source metadata and may legitimately have no ingredients.
// Manual SaveRecipe retains its existing, stricter contract.
message RecipeImportMetadata {
  string source_url = 1;
  string source_type = 2;
  optional string image_url = 3;
  repeated string instructions = 4;
  repeated string tags = 5;
  optional int32 servings = 6;
  optional int32 prep_time_minutes = 7;
  optional int32 cook_time_minutes = 8;
}

message ImportRecipeRequest {
  string household_id = 1;
  string title = 2;
  repeated ImportedRecipeIngredient ingredients = 3;
  RecipeImportMetadata metadata = 4;
}

message ImportedRecipeIngredient {
  string name = 1;
  optional double quantity = 2;
  optional string unit = 3;
  string raw_string = 4;
}

message ImportRecipeResponse {
  SavedRecipe recipe = 1;
}

// Wrapper preserves database null versus an empty JSON array.
message RecipeTextList {
  repeated string values = 1;
}
message RecipeSummary {
  string id = 1;
  string title = 2;
  RecipeTextList tags = 3;
  optional string source_url = 4;
}
message RecipeDetail {
  string id = 1;
  string title = 2;
  string household_id = 3;
  string created_at = 4;
  string source_type = 5;
  optional string source_url = 6;
  optional string image_url = 7;
  optional int32 servings = 8;
  optional int32 prep_time_minutes = 9;
  optional int32 cook_time_minutes = 10;
  RecipeTextList instructions = 11;
  RecipeTextList tags = 12;
}
message StoredRecipeIngredient {
  string id = 1;
  string name = 2;
  optional double quantity = 3;
  optional string unit = 4;
}
message ListRecipesRequest {
  string household_id = 1;
}
message ListRecipesResponse {
  repeated RecipeSummary recipes = 1;
}
message GetRecipeRequest {
  string recipe_id = 1;
}
message GetRecipeResponse {
  RecipeDetail recipe = 1;
  repeated StoredRecipeIngredient ingredients = 2;
}
message SearchRecipeIngredientsRequest {
  string household_id = 1;
  string query = 2;
}
message SearchRecipeIngredientsResponse {
  repeated string recipe_ids = 1;
}
message UpdateRecipeTagsRequest {
  string recipe_id = 1;
  repeated string tags = 2;
}
message UpdateRecipeTagsResponse {}
message DeleteRecipeRequest {
  string recipe_id = 1;
}
message DeleteRecipeResponse {}
