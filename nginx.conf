server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Fingerprinted Expo bundles — safe to cache forever (hash changes on rebuild)
    location ^~ /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Fingerprinted static assets (images, fonts, etc.)
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Unhashed files (favicon, icons, manifest) — revalidate on each visit
    location ~* \.(ico|png|json)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # HTML + SPA routes — never serve a stale shell (Safari especially caches this)
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
